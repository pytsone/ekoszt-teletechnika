<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ekoszt Teletechnika — Kosztorysowanie i Zarządzanie Zleceniami</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#0f172a;background:#f8fafc;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:#fff;border-right:1px solid #e2e8f0;padding:20px;display:flex;flex-direction:column;justify-content:space-between}.brand{font-size:20px;font-weight:800;margin:3px 0 25px}.brand span{color:#ea580c}.nav{display:grid;gap:7px}.nav button,.button{border:0;border-radius:8px;padding:11px 12px;text-align:left;background:transparent;color:#475569;font:inherit;cursor:pointer}.nav button:hover,.nav button.active{background:#fff7ed;color:#c2410c}.nav button.active{font-weight:700}.side-note{font-size:12px;color:#64748b;border-top:1px solid #e2e8f0;padding-top:16px;line-height:1.6}.main{min-width:0}.topbar{height:68px;background:#fff;border-bottom:1px solid #e2e8f0;padding:0 25px;display:flex;align-items:center;justify-content:space-between;gap:12px}.topbar h1{font-size:19px;margin:0}.top-actions{display:flex;gap:8px}.content{padding:24px;max-width:1500px;margin:auto}.button{background:#ea580c;color:white;text-align:center;padding:9px 13px;font-size:13px;font-weight:700}.button.secondary{color:#334155;background:#fff;border:1px solid #cbd5e1}.button.danger{background:#fff;color:#be123c;border:1px solid #fecdd3}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:20px}.card,.panel{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:17px;margin-bottom:16px}.label{font-size:11px;color:#64748b;font-weight:700;letter-spacing:.04em}.value{font-size:23px;font-weight:800;margin-top:8px}.muted{color:#64748b;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.list{display:grid;gap:9px}.list-item{padding:13px;border:1px solid #e2e8f0;border-radius:9px;display:flex;justify-content:space-between;align-items:center;gap:12px}.list-item h3{margin:0 0 4px;font-size:14px}.list-item p{margin:0;color:#64748b;font-size:12px}.table-wrap{overflow:auto;background:white;border:1px solid #e2e8f0;border-radius:10px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:11px 12px;border-bottom:1px solid #e2e8f0;text-align:left}th{background:#f8fafc;color:#64748b;font-size:11px;text-transform:uppercase;white-space:nowrap}td input,select,input,textarea{font:inherit}td input{max-width:110px;padding:6px;border:1px solid #cbd5e1;border-radius:5px}.pill{display:inline-block;background:#f1f5f9;border-radius:20px;padding:4px 9px;font-size:11px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:7px;background:white}.empty{padding:35px;text-align:center;color:#64748b}.notice{padding:12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;color:#9a3412;font-size:13px}.modal-backdrop{position:fixed;inset:0;background:#0f172a88;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.modal-backdrop.open{display:flex}.modal{background:#fff;border-radius:12px;padding:20px;width:min(560px,100%);max-height:90vh;overflow:auto}.modal h2{margin-top:0}.modal form{display:grid;gap:13px}.right{text-align:right}.footer-actions{display:flex;justify-content:flex-end;gap:8px}.template-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.template{padding:14px;border:1px solid #e2e8f0;border-radius:9px;background:#fff;cursor:pointer;text-align:left}.template:hover{border-color:#f97316;background:#fff7ed}.template strong{display:block;margin-bottom:6px}@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{padding:12px;border-right:0;border-bottom:1px solid #e2e8f0}.brand{margin:3px 0 12px}.nav{grid-template-columns:repeat(2,minmax(0,1fr))}.nav button{font-size:12px;padding:9px}.side-note{display:none}.topbar{height:auto;min-height:62px;padding:12px;align-items:flex-start;flex-direction:column}.content{padding:14px}.top-actions{flex-wrap:wrap}}
    @media print{.sidebar,.topbar,.actions,.no-print{display:none!important}.app{display:block}.content{padding:0}.card,.panel{border:0}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div><div class="brand">Ekoszt <span>Pro</span></div><nav class="nav" aria-label="Nawigacja">
      <button data-view="dashboard" class="active">Pulpit</button><button data-view="orders">Zlecenia i projekty</button><button data-view="estimates">Kosztorysowanie</button><button data-view="contractors">Kontrahenci i ekipy</button><button data-view="documents">Dokumenty</button>
    </nav></div>
    <div class="side-note">Dane przechowywane lokalnie w tej przeglądarce.<div class="actions"><button class="button secondary" data-action="export">Eksport JSON</button><label class="button secondary">Import JSON<input id="import-file" type="file" accept="application/json,.json" hidden></label></div><button class="button secondary" data-action="reset">Przywróć dane przykładowe</button></div>
  </aside>
  <main class="main"><header class="topbar"><h1 id="page-title">Pulpit</h1><div class="top-actions"><button class="button secondary" data-action="new-estimate">+ Nowy kosztorys</button><button class="button" data-action="new-order">+ Nowe zlecenie</button></div></header><section id="content" class="content"></section></main>
</div>
<div id="modal-backdrop" class="modal-backdrop"><div id="modal" class="modal" role="dialog" aria-modal="true"></div></div>
<script>
'use strict';
const KEY='ekoszt_teletechnika_v1';
const TEMPLATE_ITEMS={SSP:[['Okablowanie ognioodporne PH90','m',420,0.14,65,9.8,.5],['Montaż centrali SSP','kpl.',1,8.5,75,6850,45],['Montaż czujki dymu adresowalnej','szt.',38,.45,65,245,2]],CCTV:[['Okablowanie U/UTP kat. 6','m',550,.08,60,3.2,.3],['Montaż kamery IP PoE','szt.',8,1.2,65,920,15]],LAN:[['Montaż szafy teleinformatycznej RACK 19\" 42U','kpl.',1,5,70,3400,30],['Układanie kabla S/FTP kat. 6A','m',1450,.07,60,4.1,.25]],KD:[['Montaż kontrolera sieciowego KD','kpl.',2,4.5,75,2450,10],['Montaż czytnika zbliżeniowego','szt.',8,.85,65,620,5]]};
const demo=()=>({company:{name:'TechInstal Systemy Niskoprądowe Sp. z o.o.'},contractors:[{id:'c1',name:'LogiPark Zachód Sp. z o.o.',type:'Inwestor'},{id:'c2',name:'Brygada Instalacyjna nr 1',type:'Podwykonawca'}],estimates:[{id:'e1',code:'KOSZT/2026/014',title:'Hala Logistyczna — SSP',date:'2026-11-10',kp:65,kz:5,profit:15,vat:23,items:TEMPLATE_ITEMS.SSP.map(toItem)}],orders:[{id:'o1',code:'ZLC/2026/08',title:'Instalacja SSP — Hala LogiPark',investorId:'c1',tasks:[{id:'t1',name:'Układanie kabla PH90',status:'W toku',contractorId:'c2',end:'2026-12-10',offerVal:9850,realVal:9120}]}]});
function toItem(a){return {name:a[0],unit:a[1],qty:a[2],rNorm:a[3],rRate:a[4],mCost:a[5],sCost:a[6]}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.estimates)&&Array.isArray(x.orders)&&Array.isArray(x.contractors))return x}catch(e){}return demo()}
let state=load(),view='dashboard';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Nie udało się zapisać danych w przeglądarce. Sprawdź dostępne miejsce.')}}
function money(n){return new Intl.NumberFormat('pl-PL',{style:'currency',currency:'PLN'}).format(Number(n)||0)}
function itemTotal(i,e){let r=i.qty*i.rNorm*i.rRate,m=i.qty*i.mCost,s=i.qty*i.sCost;return r+m+s+(r+s)*e.kp/100+m*e.kz/100+(r+s+(r+s)*e.kp/100)*e.profit/100}
function estimateTotal(e){return (e.items||[]).reduce((a,i)=>a+itemTotal(i,e),0)}
function setView(v){view=v;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$('#page-title').textContent=({dashboard:'Pulpit',orders:'Zlecenia i projekty',estimates:'Kosztorysowanie',contractors:'Kontrahenci i ekipy',documents:'Dokumenty'})[v]||'Ekoszt';render()}
function render(){const c=$('#content');if(view==='dashboard')c.innerHTML=dashboard();else if(view==='orders')c.innerHTML=ordersView();else if(view==='estimates')c.innerHTML=estimatesView();else if(view==='contractors')c.innerHTML=contractorsView();else c.innerHTML=documentsView()}
function dashboard(){let offer=state.orders.flatMap(o=>o.tasks||[]).reduce((a,t)=>a+(+t.offerVal||0),0),cost=state.orders.flatMap(o=>o.tasks||[]).reduce((a,t)=>a+(+t.realVal||0),0);return `<div class="cards"><div class="card"><div class="label">ZLECENIA</div><div class="value">${state.orders.length}</div></div><div class="card"><div class="label">WARTOŚĆ OFERTOWA</div><div class="value">${money(offer)}</div></div><div class="card"><div class="label">KOSZT REALIZACJI</div><div class="value">${money(cost)}</div></div><div class="card"><div class="label">KOSZTORYSY</div><div class="value">${state.estimates.length}</div></div></div><div class="panel"><h2>Szybki start — kosztorysy branżowe</h2><div class="template-grid">${Object.keys(TEMPLATE_ITEMS).map(k=>`<button class="template" data-action="template" data-key="${k}"><strong>${k}</strong>Utwórz kosztorys na podstawie szablonu</button>`).join('')}</div></div><div class="panel"><h2>Ostatnie zlecenia</h2>${state.orders.length?`<div class="list">${state.orders.map(o=>`<div class="list-item"><div><h3>${esc(o.title)}</h3><p>${esc(o.code)} · ${o.tasks.length} zadań</p></div><button class="button secondary" data-action="view-orders">Otwórz</button></div>`).join('')}</div>`:'<p class="empty">Brak zleceń.</p>'}</div>`}
function ordersView(){return `<div class="row"><p class="muted">Zarządzaj zadaniami, statusem i kosztami realizacji.</p><button class="button" data-action="new-order">+ Dodaj zlecenie</button></div>${state.orders.length?state.orders.map(o=>`<div class="panel"><div class="row"><div><h2>${esc(o.title)}</h2><span class="pill">${esc(o.code)}</span></div><button class="button secondary" data-action="add-task" data-id="${esc(o.id)}">+ Dodaj zadanie</button></div><div class="table-wrap"><table><thead><tr><th>Zadanie</th><th>Status</th><th>Termin</th><th>Oferta</th><th>Koszt</th><th></th></tr></thead><tbody>${(o.tasks||[]).map(t=>`<tr><td>${esc(t.name)}</td><td><select data-task-status="${esc(t.id)}" data-order="${esc(o.id)}"><option ${t.status==='Nowe'?'selected':''}>Nowe</option><option ${t.status==='W toku'?'selected':''}>W toku</option><option ${t.status==='Zrealizowane'?'selected':''}>Zrealizowane</option></select></td><td>${esc(t.end||'—')}</td><td>${money(t.offerVal)}</td><td><input type="number" step="0.01" value="${Number(t.realVal)||0}" data-task-cost="${esc(t.id)}" data-order="${esc(o.id)}"></td><td><button class="button danger" data-action="delete-task" data-id="${esc(o.id)}" data-task="${esc(t.id)}">Usuń</button></td></tr>`).join('')}</tbody></table></div></div>`).join(''):'<div class="panel empty">Brak zleceń. Kliknij „Nowe zlecenie”, aby rozpocząć.</div>'}`}
function estimatesView(){return `<div class="row"><p class="muted">Kosztorysy i kalkulacja RMS. Zmiany zapisują się automatycznie.</p><button class="button" data-action="new-estimate">+ Nowy kosztorys</button></div>${state.estimates.length?state.estimates.map(e=>`<div class="panel"><div class="row"><div><h2>${esc(e.title)}</h2><span class="pill">${esc(e.code)} · ${esc(e.date)}</span></div><strong>${money(estimateTotal(e))} netto</strong></div><div class="actions"><button class="button secondary" data-action="add-item" data-id="${esc(e.id)}">+ Dodaj pozycję</button><button class="button secondary" data-action="export-csv" data-id="${esc(e.id)}">Eksport CSV</button><button class="button danger" data-action="delete-estimate" data-id="${esc(e.id)}">Usuń kosztorys</button></div><div class="table-wrap"><table><thead><tr><th>Opis</th><th>J.m.</th><th>Ilość</th><th>Materiał / j.</th><th>Wartość netto</th></tr></thead><tbody>${(e.items||[]).map((i,n)=>`<tr><td>${esc(i.name)}</td><td>${esc(i.unit)}</td><td><input type="number" step=".01" value="${i.qty}" data-item-field="qty" data-est="${esc(e.id)}" data-index="${n}"></td><td><input type="number" step=".01" value="${i.mCost}" data-item-field="mCost" data-est="${esc(e.id)}" data-index="${n}"></td><td>${money(itemTotal(i,e))}</td></tr>`).join('')}</tbody></table></div></div>`).join(''):'<div class="panel empty">Brak kosztorysów. Utwórz nowy albo wybierz szablon na pulpicie.</div>'}`}
function contractorsView(){return `<div class="row"><p class="muted">Baza inwestorów i podwykonawców.</p><button class="button" data-action="new-contractor">+ Dodaj kontrahenta</button></div><div class="panel">${state.contractors.length?`<div class="table-wrap"><table><thead><tr><th>Nazwa</th><th>Typ</th><th></th></tr></thead><tbody>${state.contractors.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.type)}</td><td><button class="button danger" data-action="delete-contractor" data-id="${esc(x.id)}">Usuń</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">Brak kontrahentów.</p>'}</div>`}
function documentsView(){return `<div class="panel"><h2>Dokumenty zlecenia</h2><div class="field"><label>Wybierz zlecenie</label><select id="doc-order">${state.orders.map(o=>`<option value="${esc(o.id)}">${esc(o.code)} — ${esc(o.title)}</option>`).join('')}</select></div><div class="actions"><button class="button" data-action="print">Drukuj / Zapisz PDF</button></div><div id="doc-preview" class="notice">Wybierz zlecenie i użyj przycisku, aby przygotować prosty protokół odbioru.</div><button class="button secondary" data-action="protocol">Generuj protokół</button></div>`}
function openModal(title,fields,submit){$('#modal').innerHTML=`<h2>${title}</h2><form id="modal-form">${fields}<div class="footer-actions"><button type="button" class="button secondary" data-action="close-modal">Anuluj</button><button class="button" type="submit">Zapisz</button></div></form>`;$('#modal-backdrop').classList.add('open');$('#modal-form').dataset.submit=submit}
function field(label,id,placeholder='',type='text'){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" name="${id}" type="${type}" placeholder="${placeholder}" required></div>`}
function closeModal(){$('#modal-backdrop').classList.remove('open')}
function id(prefix){return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function submitModal(kind,form){const d=Object.fromEntries(new FormData(form));if(kind==='new-order'){state.orders.unshift({id:id('o'),code:`ZLC/${new Date().getFullYear()}/${String(state.orders.length+1).padStart(2,'0')}`,title:d.title,investorId:'',tasks:[]});view='orders'}else if(kind==='new-estimate'){state.estimates.unshift({id:id('e'),code:`KOSZT/${new Date().getFullYear()}/${String(state.estimates.length+1).padStart(3,'0')}`,title:d.title,date:new Date().toISOString().slice(0,10),kp:65,kz:5,profit:15,vat:23,items:[]});view='estimates'}else if(kind==='new-contractor'){state.contractors.push({id:id('c'),name:d.name,type:d.type})}else if(kind==='add-task'){const o=state.orders.find(x=>x.id===form.dataset.order);o.tasks.push({id:id('t'),name:d.name,status:'Nowe',end:d.end,offerVal:+d.offer||0,realVal:0,contractorId:''})}else if(kind==='add-item'){const e=state.estimates.find(x=>x.id===form.dataset.estimate);e.items.push({name:d.name,unit:d.unit||'szt.',qty:+d.qty||1,rNorm:+d.norm||0,rRate:65,mCost:+d.material||0,sCost:0})}save();closeModal();render()}
function onAction(b){const a=b.dataset.action,idv=b.dataset.id;if(a==='view-orders')return setView('orders');if(a==='close-modal')return closeModal();if(a==='new-order')return openModal('Nowe zlecenie',field('Nazwa zlecenia','title','np. Instalacja CCTV'),'new-order');if(a==='new-estimate')return openModal('Nowy kosztorys',field('Nazwa kosztorysu','title','np. Instalacja SSP'),'new-estimate');if(a==='new-contractor')return openModal('Nowy kontrahent',field('Nazwa firmy / zespołu','name')+`<div class="field"><label>Typ</label><select name="type"><option>Inwestor</option><option>Podwykonawca</option></select></div>`,'new-contractor');if(a==='add-task'){openModal('Dodaj zadanie',field('Nazwa zadania','name')+field('Termin zakończenia','end','', 'date')+field('Wartość ofertowa (zł)','offer','0','number'),'add-task');$('#modal-form').dataset.order=idv;return}if(a==='add-item'){openModal('Dodaj pozycję',field('Opis pozycji','name')+field('Jednostka','unit','szt.')+field('Ilość','qty','1','number')+field('Norma robocizny (r-g)','norm','0','number')+field('Materiał za jednostkę (zł)','material','0','number'),'add-item');$('#modal-form').dataset.estimate=idv;return}if(a==='template'){const key=b.dataset.key;state.estimates.unshift({id:id('e'),code:`KOSZT/${new Date().getFullYear()}/${String(state.estimates.length+1).padStart(3,'0')}`,title:`Szablon ${key} — nowy kosztorys`,date:new Date().toISOString().slice(0,10),kp:65,kz:5,profit:15,vat:23,items:TEMPLATE_ITEMS[key].map(toItem)});save();setView('estimates');return}if(a==='delete-task'){const o=state.orders.find(x=>x.id===idv);o.tasks=o.tasks.filter(t=>t.id!==b.dataset.task)}if(a==='delete-estimate'){state.estimates=state.estimates.filter(x=>x.id!==idv)}if(a==='delete-contractor'){state.contractors=state.contractors.filter(x=>x.id!==idv)}if(a==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download='ekoszt-backup.json';link.click();URL.revokeObjectURL(u);return}if(a==='reset'){if(confirm('Przywrócić dane przykładowe? Bieżące dane zostaną zastąpione.')){state=demo();save()}}if(a==='export-csv'){const e=state.estimates.find(x=>x.id===idv);const csv=['Opis;Jm;Ilość;Wartość netto',...(e.items||[]).map(i=>`"${i.name.replaceAll('"','""')}";${i.unit};${i.qty};${itemTotal(i,e).toFixed(2)}`)].join('\n');const u=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'})),link=document.createElement('a');link.href=u;link.download=`${e.code.replaceAll('/','_')}.csv`;link.click();URL.revokeObjectURL(u);return}if(a==='print')return window.print();if(a==='protocol'){const o=state.orders.find(x=>x.id===$('#doc-order').value);$('#doc-preview').innerHTML=`<h2>PROTOKÓŁ ODBIORU ROBÓT</h2><p>Zlecenie: ${esc(o.title)} (${esc(o.code)})</p><p>Data: ${new Date().toLocaleDateString('pl-PL')}</p><ol>${o.tasks.map(t=>`<li>${esc(t.name)} — ${money(t.offerVal)}</li>`).join('')}</ol><p>Podpis Wykonawcy ____________________ &nbsp; Inwestora ____________________</p>`;return}save();render()}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-view]');if(b)return setView(b.dataset.view);const a=e.target.closest('[data-action]');if(a)onAction(a)});
document.addEventListener('submit',e=>{if(e.target.id==='modal-form'){e.preventDefault();submitModal(e.target.dataset.submit,e.target)}});
document.addEventListener('change',e=>{if(e.target.id==='import-file'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.estimates)||!Array.isArray(x.orders)||!Array.isArray(x.contractors))throw Error();state=x;save();render();alert('Kopia została wczytana.')}catch(err){alert('Nieprawidłowy plik kopii JSON.')}};r.readAsText(f)}const t=e.target;if(t.matches('[data-task-status]')){const o=state.orders.find(x=>x.id===t.dataset.order),task=o.tasks.find(x=>x.id===t.dataset.taskStatus);task.status=t.value;save();render()}if(t.matches('[data-task-cost]')){const o=state.orders.find(x=>x.id===t.dataset.order),task=o.tasks.find(x=>x.id===t.dataset.taskCost);task.realVal=Number(t.value)||0;save()}if(t.matches('[data-item-field]')){const est=state.estimates.find(x=>x.id===t.dataset.est),item=est.items[Number(t.dataset.index)];item[t.dataset.itemField]=Number(t.value)||0;save();render()}});
$('#modal-backdrop').addEventListener('click',e=>{if(e.target.id==='modal-backdrop')closeModal()});
render();
</script>
</body>
</html>
