function exportBackup() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `ekoszt-teletechnika-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function importBackup(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (parsed.estimates && parsed.orders) {
        state = parsed;
        saveState();
        render();
        alert("Kopia zapasowa została pomyślnie wczytana!");
      } else {
        alert("Nieprawidłowy format pliku kopii.");
      }
    } catch (err) {
      alert("Błąd odczytu pliku JSON.");
    }
  };
  reader.readAsText(file);
}

// ==================== CALCULATIONS (RMS ENGINE) ====================
function calcItem(item, est) {
  const R = item.qty * item.rNorm * item.rRate;
  const M = item.qty * item.mCost;
  const S = item.qty * item.sCost;
  const direct = R + M + S;
  const kpVal = (R + S) * (est.kp / 100);
  const kzVal = M * (est.kz / 100);
  const profitVal = (R + S + kpVal) * (est.profit / 100);
  const net = direct + kpVal + kzVal + profitVal;
  const unitPrice = item.qty > 0 ? net / item.qty : 0;
  return { R, M, S, direct, kpVal, kzVal, profitVal, net, unitPrice };
}

function calcEstimate(est) {
  let totalR = 0, totalM = 0, totalS = 0, totalDirect = 0, totalKp = 0, totalKz = 0, totalProfit = 0, totalNet = 0;
  est.departments.forEach(dep => {
    dep.items.forEach(it => {
      const c = calcItem(it, est);
      totalR += c.R; totalM += c.M; totalS += c.S;
      totalDirect += c.direct; totalKp += c.kpVal; totalKz += c.kzVal; totalProfit += c.profitVal;
      totalNet += c.net;
    });
  });
  const vatVal = totalNet * (est.vat / 100);
  const totalGross = totalNet + vatVal;
  return { totalR, totalM, totalS, totalDirect, totalKp, totalKz, totalProfit, totalNet, vatVal, totalGross };
}

function fmtPLN(val) {
  return new Intl.NumberFormat('pl-PL', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(val) + " zł";
}

function isOverdue(task) {
  if (task.status === "Zrealizowane" || !task.end) return false;
  const today = new Date().toISOString().slice(0, 10);
  return task.end < today;
}

            dep.items.forEach(it => { const c = calcItem(it, est); dR += c.R; dM += c.M; dNet += c.net; });
            const share = totals.totalNet > 0 ? ((dNet / totals.totalNet) * 100).toFixed(1) : 0;
            return `
              <tr>
                <td class="py-3 px-4 font-semibold text-slate-500">${idx + 1}</td>

          }).join('')}

      </table>

  if (estimateSubView === "rms") {

    est.departments.forEach(dep => dep.items.forEach(it => rows.push(it)));
    return `

                <th class="py-2 px-3 text-right">Wartość M</th>
              </tr>

            <tbody class="divide-y divide-slate-100">
              ${rows.filter(r => r.mCost > 0).map(r => `
                <tr>
                  <td class="py-2 px-3 font-medium text-slate-800">${r.name}</td>
                  <td class="py-2 px-3 text-slate-500">${r.unit}</td>

  // Kosztorys szczegółowy lub Przedmiar

  const doneCount = order.tasks.filter(t => t.status === "Zrealizowane").length;
  const overdueCount = order.tasks.filter(t => isOverdue(t)).length;
  const progress = order.tasks.length ? Math.round((doneCount / order.tasks.length) * 100) : 0;
  const sumOffer = order.tasks.reduce((s, t) => s + Number(t.offerVal || 0), 0);

              ${state.orders.map(o => `<option value="${o.id}" ${o.id===order.id?'selected':''}>${o.code} — ${o.title}</option>`).join('')}
            </select>
            <span class="text-xs px-2.5 py-1 rounded-md bg-slate-100 text-slate-600 font-medium">Inwestor: <strong>${investor ? investor.name : 'Nie przypisano'}</strong></span>
          </div>

          <div class="flex flex-wrap gap-2">
            <button onclick="openImportTasksModal('${order.id}')" class="px-3 py-2 rounded-lg border border-orange-300 bg-orange-50 text-xs font-semibold text-orange-700 hover:bg-orange-100 inline-flex items-center gap-1.5">
              <i data-lucide="import" class="w-3.5 h-3.5"></i> Importuj zadania z kosztorysu
            </button>
            <button onclick="openAddTaskModal('${order.id}')" class="px-3 py-2 rounded-lg bg-orange-600 text-white text-xs font-semibold hover:bg-orange-700 inline-flex items-center gap-1.5">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i> Dodaj zadanie
            </button>
            <button onclick="generateProtocolFromOrder('${order.id}')" class="px-3 py-2 rounded-lg border border-slate-300 bg-white text-xs font-semibold text-slate-700 hover:bg-slate-50 inline-flex items-center gap-1.5">
              <i data-lucide="file-check" class="w-3.5 h-3.5 text-emerald-600"></i> Generuj protokół
            </button>
          </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-5 gap-3 pt-3 border-t border-slate-100">
          <div>
            <div class="text-[11px] text-slate-400 font-semibold">POSTĘP REALIZACJI</div>

              <div class="flex-1 bg-slate-200 h-2 rounded-full overflow-hidden">

              </div>
            </div>
          </div>
          <div>
            <div class="text-[11px] text-slate-400 font-semibold">ZADANIA (UKOŃCZONE / PO TERM.)</div>
            <div class="text-sm font-bold text-slate-800 mt-1">${doneCount} / ${order.tasks.length} <span class="${overdueCount>0?'text-rose-600':'text-slate-400'}">(${overdueCount} po terminie)</span></div>
          </div>
          <div>
            <div class="text-[11px] text-slate-400 font-semibold">WARTOŚĆ OFERTOWA</div>
            <div class="text-sm font-bold text-slate-900 mt-1">${fmtPLN(sumOffer)}</div>

        <div class="inline-flex bg-slate-200/70 p-1 rounded-lg">
          <button onclick="orderSubView='lista'; render()" class="px-3 py-1.5 rounded-md text-xs font-semibold ${orderSubView==='lista'?'bg-white text-orange-600 shadow-xs':'text-slate-600'}">Lista zadań</button>

      <!-- SUBVIEW CONTENT -->
      ${orderSubView === "lista" ? renderOrderTaskList(order) : orderSubView === "gantt" ? renderOrderGantt(order) : renderOrderCalendar(order)}
    </div>
  `;
}

function renderOrderGantt(order) {
  const datedTasks = order.tasks.filter(t => t.start && t.end);
  if (!datedTasks.length) {
    return `<div class="bg-white p-8 rounded-xl border border-slate-200 text-center text-sm text-slate-500">Uzupełnij daty rozpoczęcia i zakończenia w zadaniach, aby wyświetlić wykres Gantta.</div>`;
  }
  const minDate = new Date(Math.min(...datedTasks.map(t => new Date(t.start))));
  const maxDate = new Date(Math.max(...datedTasks.map(t => new Date(t.end))));
  minDate.setDate(minDate.getDate() - 1);
  maxDate.setDate(maxDate.getDate() + 2);

  const days = [];
  for (let d = new Date(minDate); d <= maxDate; d.setDate(d.getDate() + 1)) {
    days.push(new Date(d));
  }

  return `
    <div class="bg-white rounded-xl border border-slate-200 overflow-x-auto shadow-xs">
      <div class="min-w-[800px]">
        <div class="grid border-b border-slate-200 bg-slate-50 text-[11px] font-semibold text-slate-500" style="grid-template-columns: 260px repeat(${days.length}, minmax(32px, 1fr));">
          <div class="p-3 border-r border-slate-200">Zadanie harmonogramu</div>
          ${days.map(d => `<div class="py-2 text-center border-r border-slate-100">${d.getDate()}.${String(d.getMonth()+1).padStart(2,'0')}</div>`).join('')}
        </div>
        <div class="divide-y divide-slate-100">
          ${datedTasks.map(t => {
            const s = new Date(t.start);
            const e = new Date(t.end);
            const barColor = t.status === "Zrealizowane" ? "bg-emerald-500" : isOverdue(t) ? "bg-rose-500" : "bg-blue-600";
            return `
              <div class="grid items-center text-xs hover:bg-slate-50" style="grid-template-columns: 260px repeat(${days.length}, minmax(32px, 1fr));">
                <div class="p-2.5 border-r border-slate-200 font-medium text-slate-800 truncate" title="${t.name}">${t.name}</div>
                ${days.map(d => {
                  const inRange = d >= s && d <= e;
                  return `<div class="h-9 border-r border-slate-100 flex items-center px-0.5">
                    ${inRange ? `<div class="w-full h-5 ${barColor} rounded-xs opacity-90" title="${t.name}: ${t.start} - ${t.end}"></div>` : ''}
                  </div>`;
                }).join('')}
              </div>
            `;
          }).join('')}
        </div>
      </div>
    </div>
  `;
}

function renderOrderCalendar(order) {
  const datedTasks = order.tasks.filter(t => t.start);
  const baseDate = datedTasks.length ? new Date(datedTasks[0].start) : new Date();
  const year = baseDate.getFullYear();
  const month = baseDate.getMonth();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const monthNames = ["Styczeń","Luty","Marzec","Kwiecień","Maj","Czerwiec","Lipiec","Sierpień","Wrzesień","Październik","Listopad","Grudzień"];

  let cells = "";
  for (let day = 1; day <= daysInMonth; day++) {
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const dayTasks = order.tasks.filter(t => t.start && t.end && iso >= t.start && iso <= t.end);
    cells += `
      <div class="min-h-24 border border-slate-100 p-1.5 bg-white">
        <div class="text-xs font-bold text-slate-400 mb-1">${day}</div>
        <div class="space-y-1">
          ${dayTasks.slice(0,3).map(t => `<div class="text-[10px] px-1.5 py-0.5 rounded truncate font-medium ${t.status==='Zrealizowane'?'bg-emerald-100 text-emerald-800':'bg-orange-100 text-orange-800'}">${t.name}</div>`).join('')}
          ${dayTasks.length > 3 ? `<div class="text-[10px] text-slate-400 font-semibold">+${dayTasks.length - 3} więcej</div>` : ''}
        </div>
      </div>
    `;
  }

  return `
    <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-xs">
      <div class="font-bold text-slate-800 mb-3">${monthNames[month]} ${year}</div>
      <div class="grid grid-cols-7 gap-1">${cells}</div>
    </div>
  `;
}

function downloadDocWord() {
  const html = document.getElementById("editable-document").innerHTML;
  const fullHtml = `<html><head><meta charset="utf-8"><style>body{font-family:Arial,sans-serif;} table{width:100%;border-collapse:collapse;} th,td{border:1px solid #999;padding:6px;}</style></head><body>${html}</body></html>`;
  const blob = new Blob(['\ufeff', fullHtml], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `dokument_${docType}_${new Date().toISOString().slice(0,10)}.doc`;
  a.click();
}

function updateMarketPrices(estId) {
  const est = state.estimates.find(e => e.id === estId);
  est.departments.forEach(d => d.items.forEach(it => {

function exportEstimateCSV(estId) {
  const est = state.estimates.find(e => e.id === estId);
  let csv = "Dział;Podstawa;Opis pozycji;Jm;Obmiar;Cena jedn. netto;Wartość netto\n";
  est.departments.forEach(d => {
    d.items.forEach(it => {
      const c = calcItem(it, est);
      csv += `"${d.name}";"${it.code}";"${it.name}";"${it.unit}";${it.qty};${c.unitPrice.toFixed(2)};${c.net.toFixed(2)}\n`;
    });
  });
  const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${est.code.replace(/\//g,'_')}.csv`;
  a.click();
}

function submitImportTasks(orderId) {
  const order = state.orders.find(o => o.id === orderId);
  const est = state.estimates.find(e => e.id === document.getElementById("imp-est").value);
  const mode = document.getElementById("imp-mode").value;
  const today = new Date().toISOString().slice(0, 10);

  if (mode === "items") {
    est.departments.forEach(d => {
      d.items.forEach(it => {
        const c = calcItem(it, est);
        order.tasks.push({
          id: "t_" + Math.random().toString(36).slice(2, 9),
          name: it.name,
          category: d.name,
          status: "Nowe",
          contractorId: "",
          start: today,
          end: today,
          unit: it.unit,
          qty: it.qty,
          offerVal: Number(c.net.toFixed(2)),
          realVal: 0
        });
      });
    });
  } else {
    est.departments.forEach(d => {
      let sum = 0;
      d.items.forEach(it => { sum += calcItem(it, est).net; });
      order.tasks.push({
        id: "t_" + Math.random().toString(36).slice(2, 9),
        name: d.name,
        category: "Etap robót",
        status: "Nowe",
        contractorId: "",
        start: today,
        end: today,
        unit: "kpl.",
        qty: 1,
        offerVal: Number(sum.toFixed(2)),
        realVal: 0
      });
    });
  }
  saveState();
  closeModal();
  render();
}

  const order = state.orders.find(o => o.id === orderId);

  render();
}

function deleteTask(orderId, taskId) {
  const order = state.orders.find(o => o.id === orderId);
  order.tasks = order.tasks.filter(x => x.id !== taskId);
  selectedTaskIds.delete(taskId);
  saveState();
  render();
}

function toggleTaskSelect(taskId) {
  if (selectedTaskIds.has(taskId)) selectedTaskIds.delete(taskId);
  else selectedTaskIds.add(taskId);
  render();
}

function toggleAllTasks(orderId, checked) {
  const order = state.orders.find(o => o.id === orderId);
  selectedTaskIds.clear();
  if (checked) order.tasks.forEach(t => selectedTaskIds.add(t.id));
  render();
}

function bulkChangeStatus(orderId, status) {
  if (!status) return;
  const order = state.orders.find(o => o.id === orderId);
  order.tasks.forEach(t => { if (selectedTaskIds.has(t.id)) t.status = status; });
  saveState();
  render();
}

function bulkDeleteTasks(orderId) {
  const order = state.orders.find(o => o.id === orderId);
  order.tasks = order.tasks.filter(t => !selectedTaskIds.has(t.id));
  selectedTaskIds.clear();
  saveState();
  render();
}
